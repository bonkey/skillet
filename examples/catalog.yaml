# A starting catalog: the skillet skill, enabled globally, so agents can find,
# enable and disable skills themselves.
#
#   mkdir -p ~/.config/skillet
#   cp examples/catalog.yaml ~/.config/skillet/catalog.yaml
#   skillet update        # clones the sources and links what is enabled
agents: [claude-code]
sources:
  bonkey/skillet:
    url: https://github.com/bonkey/skillet.git
    skills: [skillet]
packs:
  skillet:
    description: Lets agents search the catalog and enable or disable skills with skillet
    skills: [skillet]
enabled:
  packs: [skillet]
