# A starting config: the skillet skill, enabled globally, so agents can find,
# enable and disable skills themselves.
#
#   mkdir -p ~/.config/skillet
#   cp examples/config.toml ~/.config/skillet/config.toml
#   skillet sync          # clones the source and links the skill
agents = ["claude-code"]

[packs.skillet]
description = "Lets agents search the catalog and enable or disable skills with skillet"
skills = ["skillet"]

[[skills]]
url = "https://github.com/bonkey/skillet.git"
only = ["skillet"]
